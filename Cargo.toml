[package]
name = "mac-hardware-volume-control"
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/eamq/mac-hardware-volume-control"

[dependencies]
coreaudio-sys = "0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
